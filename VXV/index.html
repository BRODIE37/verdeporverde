<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Verde por Verde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#F1FAF3;--card:#fff;--ink:#1E2A33;--mut:#5A6A75;--gt:#0F7A44;--line:#DCEBE0;--soft:#E6F7EC;--warn:#FFF1E2;--wt:#9A4A00;--err:#B42318;--h1:#118A4C;--h2:#0B7A5E;--btn:#16914F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1913;--card:#17251D;--ink:#E7F2EA;--mut:#9DB2A4;--gt:#4ADE80;--line:#244033;--soft:#1B3328;--warn:#33261A;--wt:#FFB366;--err:#FF9A8F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1913;--card:#17251D;--ink:#E7F2EA;--mut:#9DB2A4;--gt:#4ADE80;--line:#244033;--soft:#1B3328;--warn:#33261A;--wt:#FFB366;--err:#FF9A8F;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px}
button,input{font:inherit;color:inherit}
.w{max-width:720px;margin:0 auto;padding:20px 18px 120px}.c{text-align:center}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 2px 14px rgba(15,122,68,.08)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:26px;padding:22px;margin-bottom:16px}
.big{font-size:64px;font-weight:800;line-height:1}.bar{height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#FFD27A;border-radius:7px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:30px;background:var(--btn);color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(22,145,79,.3)}
.btn[disabled]{background:var(--line);color:var(--mut);box-shadow:none;cursor:not-allowed}
.btn.o{background:#FF9F40;color:#1E2A33;box-shadow:0 6px 16px rgba(255,159,64,.35)}.btn.g{background:transparent;color:var(--gt);border:3px solid var(--btn);box-shadow:none;margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.t{border:0;background:var(--card);border-radius:22px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 14px rgba(15,122,68,.08);font-weight:700}
.t.on{outline:4px solid var(--btn)}.t .e{font-size:40px;display:block}.t small{color:var(--gt);font-weight:700;font-size:15px}
.pill{display:inline-block;background:var(--soft);color:var(--gt);border-radius:14px;padding:3px 12px;font-weight:700;font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}.row b{flex:1;font-weight:700}.row small{display:block;color:var(--mut);font-weight:400}
.ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.ach{display:flex;gap:14px;flex-wrap:wrap}.ach div{width:78px;text-align:center;font-size:13px;color:var(--mut)}.ach span{display:flex;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;align-items:center;justify-content:center;font-size:28px;background:var(--line);filter:grayscale(1);opacity:.6}.ach .on span{background:var(--btn);filter:none;opacity:1}
h1,h2{margin:0}.mut{color:var(--mut)}.brand{font-size:40px;font-weight:800}.brand span{color:var(--gt)}
.logo{width:110px;height:110px;margin:30px auto 14px;border-radius:32px;background:linear-gradient(135deg,#2ECC71,#12A079);display:flex;align-items:center;justify-content:center;font-size:56px}
input.in{width:100%;min-height:58px;border:2px solid var(--line);border-radius:20px;background:var(--bg);padding:0 16px;text-align:center;font-size:20px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px rgba(0,0,0,.08)}
.nav button{border:0;background:none;min-width:72px;min-height:56px;border-radius:16px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer}.nav button span{display:block;font-size:24px}.nav .on{background:var(--soft);color:var(--gt)}
.kg{display:flex;align-items:center;justify-content:space-between;gap:10px}.kg button{width:64px;height:64px;border:0;border-radius:20px;font-size:30px;font-weight:800;cursor:pointer;background:var(--soft);color:var(--gt)}.kg .p{background:var(--btn);color:#fff}
.chips{display:flex;gap:10px;margin-top:12px}.chips button{flex:1;min-height:44px;border:0;border-radius:14px;background:var(--bg);font-weight:700;cursor:pointer}
.pr{border:0;padding:0;overflow:hidden;background:var(--card);border-radius:22px;text-align:left;cursor:pointer;box-shadow:0 2px 14px rgba(15,122,68,.08)}.pr .im{height:110px;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--soft)}.pr .tx{padding:12px 14px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.md{background:var(--card);border-radius:28px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.rw{display:flex;justify-content:space-between;padding:10px 14px;border-radius:14px;background:var(--soft);margin:8px 0;font-weight:700}.rw.w2{background:var(--warn);color:var(--wt)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1E2A33;color:#fff;padding:12px 20px;border-radius:24px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}.toast.s{opacity:1}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
.ri{width:80px;min-height:40px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.dash{border-top:2px dashed var(--line);margin:14px 0}
.tabs{display:flex;background:var(--card);border-radius:20px;padding:4px;margin-bottom:14px}.tabs button{flex:1;min-height:48px;border:0;border-radius:16px;background:none;font-weight:800;color:var(--mut);cursor:pointer}.tabs .on{background:var(--btn);color:#fff}
.fl{margin-bottom:14px}.fl label{display:block;font-weight:700;margin-bottom:6px}.fl .in{text-align:left}.in[aria-invalid="true"]{border-color:var(--err)}.er{color:var(--err);font-size:14px;margin-top:4px}
.pw{position:relative}.pw .in{padding-right:56px}.eye{position:absolute;right:6px;top:6px;width:46px;height:46px;border:0;background:none;font-size:22px;cursor:pointer}
.rl{list-style:none;padding:0;margin:0 0 14px;font-size:14px;color:var(--mut)}.rl li::before{content:'○ '}.rl li.ok{color:var(--gt)}.rl li.ok::before{content:'✓ '}
button:focus-visible,input:focus-visible{outline:3px solid #FF9F40;outline-offset:2px}

.sel{min-height:40px;max-width:150px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 8px;font-weight:700}
.lnk{border:0;background:var(--soft);color:var(--gt);border-radius:14px;min-height:40px;padding:0 14px;font-weight:800;cursor:pointer}
.qr{background:#fff;border-radius:20px;padding:10px;margin:12px auto;max-width:260px}.qr svg{display:block;width:100%;height:auto}
.code{font-size:32px;font-weight:800;letter-spacing:3px;color:var(--gt);overflow-wrap:anywhere;margin:6px 0}
input.in.cc{letter-spacing:4px;font-weight:800;text-transform:uppercase;font-size:24px;text-align:center}
.cam{border-radius:22px;overflow:hidden;background:#101a14;aspect-ratio:1/1;max-width:420px;margin:0 auto 12px;position:relative}.cam video{width:100%;height:100%;object-fit:cover;display:block}.cam::after{content:'';position:absolute;inset:18%;border:4px solid #FFD27A;border-radius:22px;pointer-events:none}
.st{display:inline-block;border-radius:14px;padding:3px 10px;font-weight:700;font-size:13px;background:var(--soft);color:var(--gt)}.st.p{background:var(--warn);color:var(--wt)}.st.x{background:var(--line);color:var(--mut)}
.rm{border:0;background:var(--bg);color:var(--err);border-radius:12px;width:40px;height:40px;font-size:18px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
